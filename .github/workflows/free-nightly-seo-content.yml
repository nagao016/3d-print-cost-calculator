name: Free Nightly SEO Content Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "40 18 * * *" # 03:40 JST daily

permissions:
  contents: write

concurrency:
  group: free-nightly-seo-content
  cancel-in-progress: false

jobs:
  draft-test-report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate drafts, run checks, and create report
        run: python scripts/nightly_content_pipeline.py
      - name: Commit drafts and report
        run: |
          if git diff --quiet -- content-drafts NIGHTLY-CONTENT-REPORT.md; then
            echo "No draft or report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-drafts NIGHTLY-CONTENT-REPORT.md
          git commit -m "chore: refresh nightly SEO drafts and report"
          git push
      - name: Upload report and drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-seo-drafts-and-report
          path: |
            NIGHTLY-CONTENT-REPORT.md
            content-drafts/*.md
          retention-days: 30
