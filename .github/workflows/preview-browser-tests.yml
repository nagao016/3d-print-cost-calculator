name: Preview Browser Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "functions/**"
      - "tests/preview/**"
      - "uiux-prototype/src/**"
      - "index.html"
      - "robots.txt"
      - "sitemap.xml"
      - "guide/**"
      - ".github/workflows/preview-browser-tests.yml"
  push:
    branches:
      - feat/privacy-first-subscription-foundation
    paths:
      - "functions/**"
      - "tests/preview/**"
      - "uiux-prototype/src/**"
      - "index.html"
      - "robots.txt"
      - "sitemap.xml"
      - "guide/**"
      - ".github/workflows/preview-browser-tests.yml"

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run subscription API regression tests
        run: node --test tests/preview/backend-api.test.js
      - name: Run preview browser tests (Chromium)
        env:
          PREVIEW_URL: https://fix-stripe-checkout-payment.3d-print-cost-calculator-7ce.pages.dev/
        run: npx playwright test tests/preview --reporter=list --browser=chromium
      - name: Run preview browser tests (Firefox)
        env:
          PREVIEW_URL: https://fix-stripe-checkout-payment.3d-print-cost-calculator-7ce.pages.dev/
        run: npx playwright test tests/preview --reporter=list --browser=firefox
      - name: Run preview browser tests (WebKit)
        env:
          PREVIEW_URL: https://fix-stripe-checkout-payment.3d-print-cost-calculator-7ce.pages.dev/
        run: npx playwright test tests/preview --reporter=list --browser=webkit
