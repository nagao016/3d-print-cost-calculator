name: UI UX Prototype Build Check

on:
  pull_request:
    paths:
      - "uiux-prototype/**"
      - ".github/workflows/uiux-prototype-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: uiux-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Build prototype
        run: npm run build
