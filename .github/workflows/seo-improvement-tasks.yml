name: SEO Improvement Tasks

on:
  workflow_dispatch:
  schedule:
    # 03:20 Japan Standard Time (18:20 UTC), after the nightly site check
    - cron: "20 18 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: seo-improvement-tasks
  cancel-in-progress: false

jobs:
  generate-seo-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SEO task backlog
        run: python scripts/generate_seo_tasks.py

      - name: Commit updated task backlog
        run: |
          if git diff --quiet -- SEO-TASK-BACKLOG.md; then
            echo "SEO task backlog unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SEO-TASK-BACKLOG.md
          git commit -m "chore: refresh SEO improvement task backlog"
          git push

      - name: Upload SEO task backlog
        uses: actions/upload-artifact@v4
        with:
          name: seo-improvement-task-backlog
          path: SEO-TASK-BACKLOG.md
          retention-days: 30
