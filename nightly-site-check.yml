name: Nightly Site Check

on:
  workflow_dispatch:
  schedule:
    # 03:00 Japan Standard Time (18:00 UTC)
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-site-check
  cancel-in-progress: false

jobs:
  check-static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check static site files and basic SEO
        run: python scripts/check_site.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-site-check-report
          path: site-check-report.md
          if-no-files-found: ignore
          retention-days: 14
